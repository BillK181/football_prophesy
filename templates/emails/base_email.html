<!DOCTYPE html>
<html>
<head>
<style>

body {
    margin:0;
    padding:0;
    background-color:#f8f1e7;
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
}

.email-wrapper {
    background-color:#efc588;
    width:100%;
}

.email-container {
    width:100%;
    max-width:600px;
    background:white;
    border-radius:12px;
    overflow:hidden;
}

.email-header {
    background:#9c6e56;
    padding:30px;
    text-align:center;
}

.email-logo {
    width:400px;
    max-width:100%;
    height:auto;
    display:block;
    margin:auto;
}

.email-title {
    color:white;
    margin-top:20px;
    font-size:18px;
}

.email-body {
    padding:30px;
    color:#333333;
}

.email-text {
    font-size:16px;
    line-height:1.6;
}

.button-container {
    text-align:center;
    margin:35px 0;
}

.button {
    background:#9c6e56;
    color:white !important;
    padding:14px 28px;
    border-radius:8px;
    text-decoration:none;
    display:inline-block;
    font-weight:bold;
    font-size:16px;
}

.deadline {
    background:#efc588;
    padding:15px;
    margin:25px 0;
    border-radius:6px;
}

.footer {
    background:#f4f4f4;
    padding:15px;
    text-align:center;
    font-size:12px;
    color:#777;
}

.footer a {
    color:#9c6e56;
    text-decoration:none;
}

</style>
</head>


<body>

<table class="email-wrapper" cellpadding="0" cellspacing="0">
<tr>
<td align="center" style="padding:30px 15px;">


<table class="email-container" cellpadding="0" cellspacing="0">


<tr>
<td class="email-header">

<img
src="https://www.footballprophesy.com/static/images/football_prophesy.png"
class="email-logo"
alt="Football Prophesy"
>

<p class="email-title">
{% block title %}{% endblock %}
</p>

</td>
</tr>


<tr>
<td class="email-body">

{% block content %}
{% endblock %}

</td>
</tr>


<tr>
<td class="footer">

Football Prophesy © 2026

<br><br>

<a href="https://footballprophesy.com">
www.footballprophesy.com
</a>

</td>
</tr>


</table>


</td>
</tr>
</table>


</body>
</html>
